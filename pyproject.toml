[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-prep"
version = "0.1.0"
description = "Data preparation utility for fine-tuning OpenAI's Whisper model."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
keywords = ["whisper", "finetuning", "machine-learning"]
authors = [
  {name = "Claudio Paonessa", email = "claudio.paonessa@fhnw.ch"},
  {name = "Vincenzo Timmel", email = "vincenzo.timmel@fhnw.ch"},
]
maintainers = [{name = "Vincenzo Timmel", email = "vincenzo.timmel@fhnw.ch"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "pydub>=0.25,<0.26",
  "datasets>=4.2,<5",
  "soundfile>=0.12,<1",
  "openai-whisper>=20250625",
  "torchaudio>=2.10,<2.11",
  "pyyaml>=6,<7",
  "silero-vad>=6.2.3,<6.3",
  "fasttext-wheel>=0.9.2,<0.10",
  "pysubs2>=1.7,<2",
  "torchcodec>=0.10,<0.11",
  "torch>=2.10,<2.11",
  "numpy>=1.26,<2",
  # PyArrow 26 requires NumPy 2 when NumPy is installed.
  "pyarrow>=21,<26",
  "pandas>=2,<4",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.32,<2"]
liepa3 = ["onnxruntime>=1.32,<2", "soxr>=1.1,<2"]
test = ["pytest>=8,<10", "coverage>=7,<8"]
dev = ["pytest>=8,<10", "coverage>=7,<8", "check-manifest>=0.50", "ruff>=0.11", "build>=1", "twine>=6"]

[project.urls]
Homepage = "https://github.com/i4Ds/whisper-prep"
"Bug Reports" = "https://github.com/i4Ds/whisper-prep/issues"
Source = "https://github.com/i4Ds/whisper-prep"

[project.scripts]
whisper_prep = "whisper_prep:main"
whisper_prep_download_hf = "whisper_prep.download_hf_dataset:main"
whisper_prep_upload_asr = "whisper_prep.upload_asr_dataset:main"
whisper_prep_srt_to_hf = "whisper_prep.srt_to_hf_dataset:main"
whisper_prep_push_to_hub = "whisper_prep.push_to_hub:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hub'"
markers = ["hub: public Hugging Face integration tests; requires network on the first run"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B006"]
